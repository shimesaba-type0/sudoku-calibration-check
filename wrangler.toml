name = "sudoku-calibration-check"
main = "src/index.js"
compatibility_date = "2026-09-01"

# サービスの一時停止(Issue #106、オーナー要望2026-10-12「終了ではなく停止、今後また
# テストするかもしれない」)。*.workers.dev サブドメインへのルーティングを外すだけで、
# DNSレコードの削除ではない(そもそも利用者側で管理するDNSレコードは存在しない)。
# Worker本体のコード・Durable Object(RATE_LIMITERのレート制限カウンタ)・Workers AI
# バインディング設定は一切変更しない。再開はこの行を削除(または false→true)して
# npm run deploy するだけ。トップレベルのキーなので [vars] の中には置かないこと
# ([vars] に置くと env.workers_dev という無関係な環境変数になってしまい効かない)。
workers_dev = false

# Workers AI バインディング。Worker 内では env.AI として見える。
[ai]
binding = "AI"

# レート制限のカウンタ置き場(固定ウィンドウ)。Worker 内では env.RATE_LIMITER として見える。
# Durable Object なのでネームスペースの事前作成は不要(deploy 時に migration で作られる)。
# 以前は Workers KV を使っていたが、結果整合のため全体上限が分散アクセスに効かなかった
# (GitHub Issue #10 / docs/DESIGN.md 3.2)。
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimitCounter"

# Durable Object クラスの登録。SQLite バックエンドで作る。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitCounter"]

# レート制限の唯一の調整つまみ。ここの値を書き換えて再デプロイするだけで
# 上限が変わる(src/index.js は触らない)。数値は文字列として Worker に渡り、
# 10進整数として読めない値はコード側の既定値(30 / 500 / 3600)に落ちる。
# IP 単位は 2026-09-22 にオーナー判断(Issue #20)で 30 → 120 に緩めた。数独 1 問 ≈ 78 判定を
# 1 時間で完走できるようにするため。全体上限 500 は据え置き。
# これが Workers AI のコストを頭打ちにする唯一の砦なので、理由なく緩めないこと
# (docs/DESIGN.md 7章 / CLAUDE.md 作業ルール4)。
[vars]
RATE_LIMIT_PER_IP_MAX = "120"
RATE_LIMIT_GLOBAL_MAX = "500"
RATE_LIMIT_WINDOW_SECONDS = "3600"
